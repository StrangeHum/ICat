version: "3.8"

services:
  bot:
    build:
      context: ./telegram-bot-service
      dockerfile: docker/Dockerfile.bot
    command: python run.py
    environment:
      BOT_TOKEN: ${TELEGRAM__TOKEN}
      USE_WEBHOOK: ${USE_WEBHOOK}
      WEBHOOK_URL: ${WEBHOOK_URL}
      BACKEND_URL: http://server:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AI_SERVICE_URL: http://ai-service:8001
    volumes:
      - logs:/app/logs
    depends_on:
      - server
      - ai-service

  server:
    build:
      context: ./telegram-bot-service
      dockerfile: docker/Dockerfile.server
    command: uvicorn app.server:app --host 0.0.0.0 --port 8000
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - logs:/app/logs

  ai-service:
    build:
      context: ./ai-service
    environment:
      A4F_API_KEY: ${A4F_API_KEY}
    ports:
      - "8001:8001"
    volumes:
      - logs:/app/logs

volumes:
  logs:
