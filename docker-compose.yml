version: "3.8"

services:
  telegram-bot-service:
    build:
      context: ./telegram-bot-service
    environment:
      BOT_TOKEN: ${TELEGRAM__TOKEN}
      USE_WEBHOOK: ${USE_WEBHOOK}
      WEBHOOK_URL: ${WEBHOOK_URL}
      BACKEND_URL: ${BACKEND_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AI_SERVICE_URL: http://ai-service:8001
    ports:
      - "8000:8000"
    volumes:
      - logs:/app/logs
    depends_on:
      - ai-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  ai-service:
    build:
      context: ./ai-service
    environment:
      A4F_API_KEY: ${A4F_API_KEY}
    ports:
      - "8001:8001"
    volumes:
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  logs:
